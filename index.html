<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Profile Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Profile Status Checker</h2>

    <select id="platform">
      <option value="facebook">Facebook</option>
      <option value="instagram">Instagram</option>
    </select>

    <input type="text" id="username" placeholder="Enter username or profile URL">

    <button onclick="checkStatus()">Check Status</button>

    <div class="status" id="status">
      Status will appear here
    </div>

    <div class="profile-card" id="profileCard">
      <img id="profilePic" src="" alt="Profile Picture">

      <div id="profileName"></div>

      <div id="profileActive"></div>
    </div>
  </div>

  <script>
    function checkStatus() {
      const platform = document.getElementById("platform").value;
      const user = document.getElementById("username").value.trim();

      if (!user) {
        document.getElementById("status").innerText =
          "Please enter a username.";
        return;
      }

      document.getElementById("status").innerText =
        `Checking ${platform} profile: ${user}`;

      document.getElementById("profileCard").style.display = "block";

      document.getElementById("profileName").innerText = user;

      document.getElementById("profileActive").innerText =
        "Status: Demo Mode";

      if (platform === "facebook") {
        document.getElementById("profilePic").src =
          "https://www.facebook.com/images/fb_icon_325x325.png";
      } else {
        document.getElementById("profilePic").src =
          "https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png";
      }
    }
  </script>

</body>
</html>
